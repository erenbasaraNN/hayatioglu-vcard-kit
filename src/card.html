<!doctype html>
<html lang="tr" data-type="service">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080908">
  <meta name="color-scheme" content="dark">
  <meta name="page-type" content="service">
  <meta name="site-kind" content="other">
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{pageTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="profile">
  <meta property="og:locale" content="tr_TR">
  <title>{{pageTitle}}</title>
  <!-- {{fontLicenses}} -->
  <style>
    @font-face {
      font-family: Inter; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url({{inter-latin.woff2}}) format("woff2");
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: Inter; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url({{inter-latin-ext.woff2}}) format("woff2");
      unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
    }
    @font-face {
      font-family: "Plus Jakarta Sans"; font-style: normal; font-weight: 700 800; font-display: swap;
      src: url({{jakarta-latin.woff2}}) format("woff2");
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: "Plus Jakarta Sans"; font-style: normal; font-weight: 700 800; font-display: swap;
      src: url({{jakarta-latin-ext.woff2}}) format("woff2");
      unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
    }

    :root {
      color-scheme: dark;
      --background: #080908;
      --surface: #111310;
      --border: #1a1d18;
      --accent: #93bd29;
      --ink: #080908;
      --text: #fff;
      --muted: rgb(255 255 255 / .65);
      --wordmark: url("{{logo}}");
      --heading: "Plus Jakarta Sans", Inter, system-ui, sans-serif;
      font-family: Inter, system-ui, sans-serif;
      background-color: var(--background);
      color: var(--text);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 4px;
    }
    .svg-definitions { position: absolute; width: 0; height: 0; }
    .icon {
      width: 21px;
      height: 21px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .visually-hidden, .skip:not(:focus) {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .skip:focus {
      position: fixed;
      z-index: 2;
      inset: 12px auto auto 12px;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--background);
      color: var(--text);
    }

    .frame {
      --inset: clamp(17px, 6.1vw, 30px);
      width: 100%;
      max-width: 456px;
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      padding:
        calc(17px + env(safe-area-inset-top))
        max(var(--inset), env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom))
        max(var(--inset), env(safe-area-inset-left));
      background: linear-gradient(172deg, #141712, var(--surface) 58%, #0e100d);
    }
    .intro {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      background:
        radial-gradient(ellipse 460px 240px at 50% 50%, #1b2213, transparent 95%),
        var(--background);
      animation: intro-away 1450ms ease both;
    }
    .intro-lockup {
      display: grid;
      justify-items: center;
      gap: 22px;
      animation: brand-in 570ms cubic-bezier(.2,.75,.2,1) both;
    }
    .wordmark {
      position: relative;
      display: block;
      aspect-ratio: 666 / 161;
      background: var(--wordmark) center / contain no-repeat;
    }
    .intro-logo { width: clamp(184px, 59vw, 286px); }
    .intro-logo::after {
      position: absolute;
      inset: 0;
      content: "";
      mask: var(--wordmark) center / contain no-repeat;
      background: linear-gradient(113deg, transparent 39%, #d6ef9c 50%, transparent 61%) 100% / 260% 100%;
      animation: logo-light 880ms 180ms cubic-bezier(.24,.68,.29,1) both;
    }
    .intro-lockup::after {
      width: 56px;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, #a9ca60, transparent);
      box-shadow: 0 0 13px rgb(147 189 41 / .45);
      animation: intro-line 760ms 100ms ease both;
    }
    body:focus-within .intro { display: none; }

    .card-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      min-height: 64px;
      align-items: center;
      border-bottom: 1px solid rgb(255 255 255 / .08);
      padding-block-end: 12px;
    }
    .brand {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-column: 2;
      grid-row: 1;
      min-height: 44px;
      place-items: center;
      animation: brand-in 720ms 850ms cubic-bezier(.2,.75,.2,1) both;
    }
    .brand::before {
      position: absolute;
      z-index: -1;
      content: "";
      pointer-events: none;
      inset: -6px -18px;
      background: radial-gradient(ellipse, rgb(147 189 41 / .17), transparent 72%);
      animation: breathe 5.5s 1500ms ease-in-out infinite;
    }
    .brand .wordmark { width: clamp(126px, 39vw, 158px); }

    .qr-toggle, .close {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid rgb(255 255 255 / .11);
      border-radius: 12px;
      padding: 0 12px;
      color: var(--text);
      background: rgb(255 255 255 / .035);
      font-size: .77rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .qr-toggle {
      grid-column: 3;
      grid-row: 1;
      justify-self: end;
      gap: 5px;
      padding-inline: 8px;
    }
    .qr-toggle .icon { width: 16px; height: 16px; color: var(--accent); }

    .hero {
      padding-block: 16px 21px;
      text-align: center;
      animation: profile-in 680ms 875ms cubic-bezier(.2,.7,.2,1) both;
    }
    .portrait-stage {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      height: 192px;
      overflow: hidden;
      border-radius: 20px;
      background: radial-gradient(ellipse at 50% 53%, rgb(147 189 41 / .13), transparent 69%);
    }
    .portrait-stage::before, .portrait-stage::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      inset: 0;
    }
    .portrait-stage::before {
      background:
        linear-gradient(90deg, transparent 49.8%, rgb(170 198 133 / .19) 50%, transparent 50.2%),
        repeating-linear-gradient(90deg, rgb(170 198 133 / .11) 0 1px, transparent 1px 21px),
        repeating-linear-gradient(0deg, rgb(170 198 133 / .11) 0 1px, transparent 1px 21px);
      mask-image: radial-gradient(ellipse 49% 48%, #000 12%, transparent 97%);
    }
    .portrait-stage::after {
      background:
        linear-gradient(90deg, transparent, rgb(147 189 41 / .32), transparent) center / 89% 1px no-repeat,
        repeating-radial-gradient(ellipse 117px 60px, transparent 98%, rgb(147 189 41 / .16) 99% 100%, transparent 101% 116%);
      mask-image: radial-gradient(ellipse 46% 47%, #000 35%, transparent);
    }
    .portrait {
      position: relative;
      isolation: isolate;
      width: 162px;
      aspect-ratio: 1;
      padding: 4px;
      overflow: hidden;
      border: 1px solid rgb(147 189 41 / .85);
      border-radius: 43px;
      background: #191e11;
      box-shadow: 0 0 0 5px rgb(147 189 41 / .055), 0 12px 38px #050605b3, 0 0 26px rgb(147 189 41 / .14);
      transform: perspective(560px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
      transition: transform 220ms ease;
    }
    .portrait::after {
      position: absolute;
      inset: 4px;
      content: "";
      border-radius: 37px;
      pointer-events: none;
      background: linear-gradient(135deg, rgb(255 255 255 / .19), transparent 47%);
      opacity: var(--shine, .35);
      transition: opacity 220ms ease;
    }
    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 37px;
      object-fit: cover;
    }
    h1 {
      margin: 6px 0 8px;
      font: 800 clamp(1.95rem, 9vw, 2.69rem)/1.08 var(--heading);
      overflow-wrap: anywhere;
      letter-spacing: -.045em;
      word-spacing: .035em;
    }
    .role, .company { margin: 0; line-height: 1.5; }
    .role { color: var(--muted); font-size: .94rem; }
    .company { margin-top: 4px; color: var(--muted); font-size: .76rem; }

    .primary {
      position: relative;
      isolation: isolate;
      display: flex;
      width: 100%;
      min-height: 57px;
      align-items: center;
      justify-content: center;
      gap: 11px;
      overflow: hidden;
      border: 1px solid rgb(214 255 108 / .30);
      border-radius: 15px;
      padding: 12px 24px;
      color: var(--ink);
      background-color: var(--accent);
      box-shadow: 0 7px 21px rgb(147 189 41 / .14), inset 0 1px 0 rgb(255 255 255 / .26);
      font: 800 .99rem/1.25 var(--heading);
    }
    .primary::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      content: "";
      background: linear-gradient(110deg, transparent 35%, rgb(255 255 255 / .23) 49%, transparent 63%);
      transform: translateX(-105%);
      animation: sweep 7s 1.1s ease-in-out infinite;
    }
    .primary .forward { position: absolute; right: 15px; width: 17px; height: 17px; }
    .primary .icon { stroke-width: 1.9; }

    .contact { margin-block-start: 23px; }
    .contact h2 {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .contact h2::after { height: 1px; flex: 1; background: rgb(255 255 255 / .075); content: ""; }
    .contact-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .tile {
      display: grid;
      grid-template-columns: auto minmax(0,1fr) auto;
      min-height: 62px;
      align-items: center;
      gap: 8px;
      border: 1px solid rgb(255 255 255 / .09);
      border-radius: 14px;
      padding: 8px;
      background: linear-gradient(130deg, rgb(255 255 255 / .055), rgb(255 255 255 / .018));
      backdrop-filter: blur(12px);
    }
    .tile:is(.email, .wide) { grid-column: 1 / -1; }
    .phone { grid-template-columns: auto minmax(0,1fr); }

    .tile-icon {
      display: grid;
      place-items: center;
      width: 33px;
      height: 33px;
      border: 1px solid rgb(147 189 41 / .15);
      border-radius: 9px;
      background: rgb(147 189 41 / .075);
      color: #b0d85b;
    }
    .tile-icon .icon { width: 17px; height: 17px; }
    .tile > .icon { width: 12px; height: 12px; color: var(--muted); }
    .tile-label, .tile-value { display: block; }
    .tile-label { font-size: .79rem; font-weight: 650; line-height: 1.25; }
    .tile-value { margin-top: 4px; color: var(--muted); font-size: .66rem; line-height: 1.3; overflow-wrap: anywhere; }

    .primary, .tile, .qr-toggle, .close {
      transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease;
    }
    @media (hover: hover) {
      .primary:hover { transform: translateY(-2px); background-color: #a3ce36; }
      :is(.tile, .qr-toggle, .close):hover {
        transform: translateY(-2px);
        border-color: rgb(147 189 41 / .51);
        background-color: rgb(147 189 41 / .045);
      }
    }
    :is(.primary, .tile, .qr-toggle, .close):active { transform: translateY(1px); }

    .qr-dialog {
      width: min(350px, calc(100% - 32px));
      max-height: calc(100% - 32px);
      margin: auto;
      border: 1px solid #373e30;
      border-radius: 24px;
      padding: 20px;
      color: var(--text);
      background: #171a14;
      box-shadow: 0 20px 80px #000b;
    }
    .qr-dialog::backdrop { background: #050605c9; backdrop-filter: blur(8px); }
    .qr-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .qr-header h2 { margin: 0; font: 800 1.24rem/1.25 var(--heading); }
    .close { width: 44px; padding: 0; }
    .qr-dialog p { margin: 10px 0 16px; color: var(--muted); font-size: .84rem; line-height: 1.55; }
    .qr-image {
      display: block;
      width: 100%;
      max-width: 243px;
      height: auto;
      margin: 0 auto 16px;
      background: white;
      image-rendering: pixelated;
    }
    .qr-download { min-height: 48px; font-size: .88rem; }
    .no-script { color: var(--muted); font-size: .86rem; }

    @media (max-width: 354px) {
      .tile:not(.email) > .icon { display: none; }
      .tile:not(.email) { grid-template-columns: auto minmax(0,1fr); gap: 6px; }
    }
    @media (min-width: 500px) {
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100svh;
        padding: 24px;
        background:
          radial-gradient(ellipse 600px 430px at 50% 22%, rgb(147 189 41 / .105), transparent 94%),
          radial-gradient(ellipse 82% 65% at 50% 1%, #131810, transparent 75%),
          repeating-linear-gradient(128deg, transparent 0 37px, rgb(201 233 173 / .022) 37px 38px),
          var(--background);
      }
      .frame {
        min-height: 0;
        padding: 21px var(--inset) 28px;
        border: 1px solid #32392b;
        border-radius: 34px;
        box-shadow: 0 0 0 6px #ffffff06, 0 28px 92px #000b, inset 0 1px #ffffff10;
      }
      .portrait-stage { height: 204px; }
      .portrait { width: 174px; }
      .tile { padding-inline: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .intro { display: none; }
      .portrait { transform: none; }
      .primary:hover, :is(.tile, .qr-toggle, .close):hover { transform: none; }
    }
    @keyframes intro-away {
      0%, 68% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }
    @keyframes logo-light {
      from { background-position: 100% 0; }
      to { background-position: 0 0; }
    }
    @keyframes intro-line {
      from { opacity: 0; transform: scaleX(.2); }
      68%, 100% { opacity: .8; transform: scaleX(1); }
    }
    @keyframes profile-in {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes brand-in {
      from { opacity: 0; transform: scale(.94); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes breathe {
      0%, 100% { opacity: .28; }
      50% { opacity: .85; }
    }
    @keyframes sweep {
      0%, 67% { transform: translateX(-105%); }
      89%, 100% { transform: translateX(105%); }
    }
  </style>
</head>
<body>
  <div class="intro" aria-hidden="true">
    <div class="intro-lockup"><span class="wordmark intro-logo"></span></div>
  </div>
  <a class="skip" href="#card-title">Kartvizite geç</a>
  <svg class="svg-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-qr" viewBox="0 0 24 24">
      <rect x="3" y="3" width="6" height="6" rx=".6"/><rect x="15" y="3" width="6" height="6" rx=".6"/>
      <rect x="3" y="15" width="6" height="6" rx=".6"/><path d="M12 4v4m-8 4h4m4 0h6v3h3v6h-5v-3h-4v3m0-6v-3"/>
    </symbol>
    <symbol id="i-person" viewBox="0 0 24 24">
      <circle cx="9" cy="8" r="3.2"/><path d="M3.5 19v-1.8a4 4 0 0 1 4-4h3a4 4 0 0 1 4 4V19m4-11v6m-3-3h6"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24">
      <path d="M7.3 3.8 9.8 8l-2 2.1a14 14 0 0 0 6.1 6.1l2.1-2 4.2 2.5c.6.3.9 1 .7 1.6l-.6 2c-.2.7-.9 1.1-1.6 1C10.1 20.7 3.3 13.9 2.7 5.3c-.1-.7.3-1.4 1-1.6l2-.6c.6-.2 1.3.1 1.6.7Z"/>
    </symbol>
    <symbol id="i-whatsapp" viewBox="0 0 24 24">
      <path d="M21 11.8a9 9 0 0 1-13.4 7.8L3 21l1.4-4.5A9 9 0 1 1 21 11.8Z"/>
      <path d="m9.4 7.5 1.1 2.1-1.1 1.1a6.5 6.5 0 0 0 3.7 3.6l1.1-1.1 2.2 1.1c.2.1.3.3.2.6-.2 1.1-1 1.5-2.1 1.3-3-.5-6.1-3.5-6.6-6.6-.2-1 .2-1.8 1-2.1.2-.1.4-.1.5 0Z"/>
    </symbol>
    <symbol id="i-mail" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24">
      <path d="M19 10c0 5-7 10.7-7 10.7S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2.4"/>
    </symbol>
    <symbol id="i-globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M3.2 12h17.6M12 3c2.5 2.4 3.6 5.4 3.6 9s-1.1 6.6-3.6 9c-2.5-2.4-3.6-5.4-3.6-9S9.5 5.4 12 3Z"/>
    </symbol>
    <symbol id="i-up-right" viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <main class="frame">
    <header class="card-top">
      <div class="brand" role="img" aria-label="{{brand}}">
        <span class="wordmark"></span>
      </div>
      <button class="qr-toggle" type="button" aria-label="QR Kod" aria-haspopup="dialog" aria-controls="qr-dialog" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-qr"/></svg>
        QR
      </button>
    </header>

    <section class="hero" aria-labelledby="card-title" data-enter>
      <div class="portrait-stage">
        <div class="portrait">
          <img src="{{portrait}}" alt="{{name}}" width="520" height="520">
        </div>
      </div>
      <h1 id="card-title" tabindex="-1">{{name}}</h1>
      {{role}}
      <p class="company">{{organization}}</p>
    </section>

    <a id="save-contact" class="primary" href="{{contactHref}}" type="text/vcard">
      <svg class="icon" aria-hidden="true"><use href="#i-person"/></svg>
      Rehbere Kaydet
      <svg class="icon forward" aria-hidden="true"><use href="#i-right"/></svg>
    </a>
    <p class="visually-hidden" id="contact-status" role="status"></p>
    <noscript><p class="no-script">QR kodu açmak için JavaScript’i etkinleştirin.</p></noscript>

{{contactNav}}
  </main>

  <dialog class="qr-dialog" id="qr-dialog" aria-labelledby="qr-title" aria-describedby="qr-instructions">
    <div class="qr-header">
      <h2 id="qr-title">Kartvizit QR kodu</h2>
      <form method="dialog">
        <button class="close" aria-label="Kapat" autofocus>
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </form>
    </div>
    <p id="qr-instructions">İletişim bilgilerini almak için telefon kamerasıyla QR kodu okutun.</p>
    <img class="qr-image" loading="lazy" src="{{qr}}" alt="{{name}} için iletişim QR kodu" width="{{qrSize}}" height="{{qrSize}}">
    <a class="primary qr-download" download="{{slug}}-qr.png">
      <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
      QR Kodu İndir
    </a>
  </dialog>

  <script>
    const saveLink = document.querySelector("#save-contact");
    saveLink.addEventListener("click", (event) => {
      if (location.protocol !== "file:") return;
      event.preventDefault();
      const file = new Blob([{{vcardJS}}], { type: "text/vcard;charset=utf-8" });
      const fileURL = URL.createObjectURL(file);
      const link = document.createElement("a");
      link.href = fileURL;
      link.download = "{{slug}}.vcf";
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(fileURL), 60000);
      document.querySelector("#contact-status").textContent = "Kartvizit dosyası hazır. Gerekirse indirilen dosyayı açarak kişiyi rehberinize ekleyin.";
    });

    const qrDialog = document.querySelector("#qr-dialog");
    const qrToggle = document.querySelector(".qr-toggle");
    const qrImage = document.querySelector(".qr-image");
    document.querySelector(".qr-download").href = qrImage.src;
    if (typeof qrDialog.showModal === "function") {
      qrToggle.hidden = false;
      qrToggle.addEventListener("click", () => qrDialog.showModal());
    }
    qrDialog.addEventListener("click", (event) => {
      if (event.target !== qrDialog) return;
      const bounds = qrDialog.getBoundingClientRect();
      const outside = event.clientX < bounds.left || event.clientX > bounds.right ||
        event.clientY < bounds.top || event.clientY > bounds.bottom;
      if (outside) qrDialog.close();
    });
    qrDialog.addEventListener("close", () => qrToggle.focus());

    const portrait = document.querySelector(".portrait");
    const stage = document.querySelector(".portrait-stage");
    const allowTilt = matchMedia("(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)");
    stage.addEventListener("pointermove", (event) => {
      if (!allowTilt.matches || event.pointerType !== "mouse") return;
      const bounds = stage.getBoundingClientRect();
      const horizontal = (event.clientX - bounds.left) / bounds.width - .5;
      const vertical = (event.clientY - bounds.top) / bounds.height - .5;
      portrait.style.setProperty("--tilt-x", (-vertical * 8) + "deg");
      portrait.style.setProperty("--tilt-y", (horizontal * 10) + "deg");
      portrait.style.setProperty("--shine", .62);
    });
    stage.addEventListener("pointerleave", () => {
      portrait.style.removeProperty("--tilt-x");
      portrait.style.removeProperty("--tilt-y");
      portrait.style.removeProperty("--shine");
    });
  </script>
</body>
</html>
